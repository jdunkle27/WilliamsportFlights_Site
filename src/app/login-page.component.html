<section class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">Secure access</p>
    <h1>Sign in to view historical flight data</h1>
    <p class="intro">
      Sign in with Google to view archived Williamsport flight activity, trend analysis, and operating history.
    </p>

    <div *ngIf="isGoogleConfigured; else missingGoogleConfig" class="oauth-actions" aria-label="Google login">
      <asl-google-signin-button
        type="standard"
        size="large"
        text="continue_with"
        shape="rectangular"
        theme="outline"
        width="100%">
      </asl-google-signin-button>
    </div>

    <ng-template #missingGoogleConfig>
      <p class="auth-error" role="alert">
        Google sign-in is not configured. Add your Google OAuth client ID to the environment file.
      </p>
    </ng-template>

    <p class="back-link">
      <a routerLink="/">Return to the live map</a>
    </p>
  </div>
</section>
