<section class="auth-shell">
  <div class="auth-card">
    <p class="eyebrow">Secure access</p>
    <h1>Sign in to view historical flight data</h1>
    <p class="intro">
      Sign in with Google to view archived Williamsport flight activity, trend analysis, and operating history.
    </p>

    <div class="oauth-actions" aria-label="OAuth login options">
      <button type="button" class="oauth-button google" (click)="loginWithGoogle()" [disabled]="isSigningIn">
        <span class="icon" aria-hidden="true">G</span>
        {{ isSigningIn ? 'Signing in...' : 'Continue with Google' }}
      </button>
    </div>

    <p *ngIf="errorMessage" class="auth-error" role="alert">{{ errorMessage }}</p>

    <p class="back-link">
      <a routerLink="/">Return to the live map</a>
    </p>
  </div>
</section>
