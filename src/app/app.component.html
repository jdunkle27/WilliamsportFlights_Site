<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Williamsport Flights home">
      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span class="brand-name">Williamsport Flights</span>
    </a>

    <nav class="topbar-actions" aria-label="Account navigation">
      @if (authService.isAuthenticated()) {
        <a class="button-link secondary" routerLink="/history">Historical Data</a>
        <button type="button" class="button-link" (click)="logout()">Log Out</button>
      } @else {
        <a class="button-link" routerLink="/login">Log In</a>
      }
    </nav>
  </header>

  <main class="page-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="page-footer">
    <span>Williamsport Flight Tracker</span>
    <span>Operational intelligence</span>
  </footer>
</div>
